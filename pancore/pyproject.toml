[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pancore"
version = "0.1.0"
description = "Core utilities shared across pan* projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [ { name = "fettigcj" } ]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
# Add runtime dependencies here if pancore needs non-stdlib imports
# dependencies = [
# ]

[project.urls]
Repository = "https://github.com/fettigcj/pancore"

[tool.setuptools]
# Using flat layout: the package directory is "." and the package name is "pancore"

[tool.setuptools.packages.find]
where = ["."]
include = ["pancore*"]
exclude = ["tests*"]
